repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: fmt-check
        name: fmt-check
        entry: nix-shell --run 'just pre-commit'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: pre-push
        name: pre-push
        entry: nix-shell --run 'just pre-push'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: cog-verify
        name: cog verify (Conventional Commits)
        # pre-commit appends the message file path; nix-shell --run cannot
        # take arguments, so bash passes it through as $1. Messages that git
        # writes for a later rebase or a merge are skipped: a fixup that
        # reaches a push still fails `just check-commits` and CI. The
        # subject is the first line that is neither blank nor a comment.
        entry: bash -c 'subject=$(sed -n "/^[^#[:space:]]/{p;q;}" "$1"); case "$subject" in "fixup! "*|"squash! "*|"amend! "*|"Merge "*) exit 0 ;; esac; exec nix-shell --run "cog verify --file \"$1\""' --
        language: system
        stages: [commit-msg]
