repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: fmt-check
        name: fmt-check
        entry: nix-shell --run 'just pre-commit'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: pre-push
        name: pre-push
        entry: nix-shell --run 'just pre-push'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: cog-verify
        name: cog verify (Conventional Commits)
        # pre-commit appends the message file path; nix-shell --run cannot
        # take arguments, so bash passes it through as $1.
        entry: bash -c 'exec nix-shell --run "cog verify --file \"$1\""' --
        language: system
        stages: [commit-msg]
