name: Release

on:
  # Gate on CI: fire only after the CI workflow finishes against
  # `main`, and skip the job body if CI did not conclude with success
  # (see the `if:` on the prepare job below). Without this gate, a
  # push to `main` would trigger ci.yml and release.yml in parallel
  # and could cut a release even when canonical-gate was red.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Publish a tag that already exists to crates.io and GitHub Releases.
  # Retries a release run that failed after its tag push (each publish
  # step skips what is already there), and cuts 1.0.0, because
  # `just release` finds nothing to bump once that tag is pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, such as v1.0.0
        required: true
        type: string

# Jobs that build code hold no write access. Building runs code from
# the crate's dependencies (build scripts, proc macros), and that code
# can read anything the job holds: the job token (the Nix install writes
# it to /etc/nix/nix.conf), step environments, and runner memory through
# sudo. So `prepare` builds with a read-only token, and the jobs that
# write (`push`, `github-release`) build nothing. `crates-io` builds and
# holds the crates.io token, as `cargo publish` must.
permissions: {}

# Prevent two release runs from racing. `cancel-in-progress: false`
# protects an in-flight release from being killed mid tag-push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    # The workflow_run trigger fires for every CI run whose head branch
    # is named `main`, whatever its conclusion and wherever it ran. The
    # conditions below are the actual gate:
    # - CI succeeded.
    # - CI ran for a push, not a pull request. A fork's pull request
    #   from a branch named `main` passes the `branches` filter above.
    # - The pushed branch belongs to this repository.
    if: >-
      ${{ github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      tree: ${{ steps.bump.outputs.tree }}
    steps:
      # Check out the commit CI passed, not whatever `main` points at
      # now, so a release never contains a commit without a green run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # A newer push has its own CI run and its own release run, which
      # covers these commits too.
      - name: Skip when main has moved on
        id: tip
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved past the commit CI passed; the CI run of a later push releases it. A push without a CI run, such as a Dependabot merge, releases nothing until the next push that runs CI"
          fi

      # Every tool step below (cog, cargo, the publish scripts) runs in
      # shell.nix, on the pinned toolchain and the
      # pinned cocogitto and cargo-semver-checks. cargo-semver-checks parses
      # rustdoc JSON, whose format tracks the compiler, so an unpinned
      # rustdoc breaks it: that is what blocked v0.18.0.
      - uses: cachix/install-nix-action@v31
        if: steps.tip.outputs.current == 'true'

      # Commits and tags locally, or leaves HEAD alone when no commit
      # since the last tag needs a release. Nothing is built yet, so
      # the outputs come from the bump alone.
      - name: Bump version
        if: steps.tip.outputs.current == 'true'
        id: bump
        run: nix-shell --run ./scripts/ci-bump.sh

      # Compares the bumped crate against the newest version on
      # crates.io. A break the bump does not allow stops the release
      # here, before anything leaves the runner.
      - name: Check semver
        if: steps.bump.outputs.tag != ''
        run: nix-shell --run 'just semver-check'

      # Builds the crate exactly as it will be uploaded. A file missing
      # from the `include` list fails here, before the tag claims the
      # version.
      - name: Check the package
        if: steps.bump.outputs.tag != ''
        run: nix-shell --run 'cargo publish --dry-run --locked'

  # Cuts the same bump again, without building anything, and pushes it
  # only if it matches the one `prepare` checked.
  push:
    name: push
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Bump version
        id: bump
        run: nix-shell --run ./scripts/ci-bump.sh

      - name: Check the bump is the one prepare checked
        env:
          WANT_TAG: ${{ needs.prepare.outputs.tag }}
          WANT_TREE: ${{ needs.prepare.outputs.tree }}
          TAG: ${{ steps.bump.outputs.tag }}
          TREE: ${{ steps.bump.outputs.tree }}
        run: |
          if [ "$TAG" != "$WANT_TAG" ] || [ "$TREE" != "$WANT_TREE" ]; then
            echo "::error::bump cut ${TAG:-nothing} (tree ${TREE:-none}); prepare checked ${WANT_TAG} (tree ${WANT_TREE}). Re-run the release workflow."
            exit 1
          fi

      # The push is not forced, so it fails if main moved after the
      # checkout, and --atomic then leaves the tag unpushed too. The
      # token goes to this command alone, not into .git/config.
      - name: Push the bump commit and tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push --atomic origin HEAD:refs/heads/main "$TAG"

  # The publish jobs serve both a fresh release and a tag named by hand,
  # so the retry path runs on every release, not only after a failure.
  # Each publish script skips what already exists.
  crates-io:
    name: crates-io
    needs: [prepare, push]
    # `prepare` and `push` are skipped on a dispatch, and `always()`
    # keeps that skip from skipping this job too.
    # A dispatch must run from main, so main's copy of this workflow and
    # its tag check apply.
    if: >-
      ${{ always()
          && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
              || needs.push.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      # Through the environment, not inlined into the shell: a dispatch
      # input is free text.
      TAG: ${{ inputs.tag || needs.prepare.outputs.tag }}
    steps:
      # The scripts and tools come from main, the tag's files from a
      # worktree. A retry after a fix to a publish script on main then
      # runs the fixed script, not the tag's copy.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A dispatch can name any tag. Publish only tags on main, so a
      # release holds only commits that went through main's checks.
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$TAG" origin/main

      - name: Check out the tag
        run: |
          git worktree add --detach "$RUNNER_TEMP/tag" "$TAG"
          echo "TAG_DIR=$RUNNER_TEMP/tag" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@v31

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_KEY }}
        run: nix-shell --run "cd \"\$TAG_DIR\" && \"\$GITHUB_WORKSPACE/scripts/publish-crate.sh\" \"\$TAG\""

  # Builds nothing, so it may hold the write token that creating a
  # release needs.
  github-release:
    name: github-release
    needs: [prepare, crates-io]
    if: ${{ always() && needs.crates-io.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the tag
        run: |
          git worktree add --detach "$RUNNER_TEMP/tag" "$TAG"
          echo "TAG_DIR=$RUNNER_TEMP/tag" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@v31

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix-shell --run "cd \"\$TAG_DIR\" && \"\$GITHUB_WORKSPACE/scripts/publish-release.sh\" \"\$TAG\""
