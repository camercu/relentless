name: Release

on:
  # Gate on CI: fire only after the CI workflow finishes against
  # `main`, and skip the job body if CI did not conclude with success
  # (see the `if:` on the bump job below). Without this gate, a
  # push to `main` would trigger ci.yml and release.yml in parallel
  # and could cut a release even when canonical-gate was red.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Publish a tag that already exists to crates.io and GitHub Releases.
  # Retries a release run that failed after its tag push (each publish
  # step skips what is already there), and cuts 1.0.0, because
  # `just release` finds nothing to bump once that tag is pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, such as v1.0.0
        required: true
        type: string

# No job both builds code and holds a token that can write. Building
# runs code from the crate's dependencies (build scripts, proc macros),
# and that code can read anything its job holds: the job token (the Nix
# install writes it to /etc/nix/nix.conf), step environments, and runner
# memory through sudo. So:
# - `bump` cuts the release commit and tag, builds nothing, and hands
#   them on as a bundle artifact.
# - `prepare` builds and checks the bundled commit with a read-only token.
# - `push` checks the bundle against `bump`'s outputs and pushes it.
# - `crates-io` uploads the crate without building it.
# - `github-release` creates the release and builds nothing.
permissions: {}

# Prevent two release runs from racing. `cancel-in-progress: false`
# protects an in-flight release from being killed mid tag-push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: bump
    # The workflow_run trigger fires for every CI run whose head branch
    # is named `main`, whatever its conclusion and wherever it ran. The
    # conditions below are the actual gate:
    # - CI succeeded.
    # - CI ran for a push, not a pull request. A fork's pull request
    #   from a branch named `main` passes the `branches` filter above.
    # - The pushed branch belongs to this repository.
    if: >-
      ${{ github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      commit: ${{ steps.bump.outputs.commit }}
      tag_id: ${{ steps.bump.outputs.tag_id }}
    steps:
      # Check out the commit CI passed, not whatever `main` points at
      # now, so a release never contains a commit without a green run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # A newer push has its own CI run and its own release run, which
      # covers these commits too.
      - name: Skip when main has moved on
        id: tip
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved past the commit CI passed; the CI run of a later push releases it. A push without a CI run, such as a Dependabot merge, releases nothing until the next push that runs CI"
          fi

      # Every tool step (cog, cargo, the publish scripts) runs in
      # shell.nix, on the pinned toolchain and the
      # pinned cocogitto and cargo-semver-checks. cargo-semver-checks parses
      # rustdoc JSON, whose format tracks the compiler, so an unpinned
      # rustdoc breaks it: that is what blocked v0.18.0.
      - uses: cachix/install-nix-action@v31
        if: steps.tip.outputs.current == 'true'

      # Commits and tags locally, or leaves HEAD alone when no commit
      # since the last tag needs a release.
      - name: Bump version
        if: steps.tip.outputs.current == 'true'
        id: bump
        run: nix-shell --run "./scripts/ci-bump.sh \"\$RUNNER_TEMP/bump.bundle\""

      - uses: actions/upload-artifact@v7
        if: steps.bump.outputs.tag != ''
        with:
          name: bump
          path: ${{ runner.temp }}/bump.bundle
          if-no-files-found: error

  prepare:
    name: prepare
    needs: bump
    if: needs.bump.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: bump
          path: ${{ runner.temp }}

      - name: Check out the bump
        env:
          WANT_TAG: ${{ needs.bump.outputs.tag }}
          WANT_COMMIT: ${{ needs.bump.outputs.commit }}
          WANT_TAG_ID: ${{ needs.bump.outputs.tag_id }}
        run: ./scripts/ci-unbundle.sh "$RUNNER_TEMP/bump.bundle"

      - uses: cachix/install-nix-action@v31

      # Compares the bumped crate against the newest version on
      # crates.io. A break the bump does not allow stops the release
      # here, before anything leaves the runner.
      - name: Check semver
        run: nix-shell --run 'just semver-check'

      # Builds the crate exactly as it will be uploaded. A file missing
      # from the `include` list fails here, before the tag claims the
      # version. The upload itself builds nothing.
      - name: Check the package
        run: nix-shell --run 'cargo publish --dry-run --locked'

  # Builds nothing. The bundle passed through `prepare`, which builds, so
  # ci-unbundle.sh checks it against `bump`'s outputs before the push.
  push:
    name: push
    needs: [bump, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: bump
          path: ${{ runner.temp }}

      - name: Check out the bump
        env:
          WANT_TAG: ${{ needs.bump.outputs.tag }}
          WANT_COMMIT: ${{ needs.bump.outputs.commit }}
          WANT_TAG_ID: ${{ needs.bump.outputs.tag_id }}
        run: ./scripts/ci-unbundle.sh "$RUNNER_TEMP/bump.bundle"

      # The push is not forced, so it fails if main moved after CI
      # passed, and --atomic then leaves the tag unpushed too. The token
      # goes to this command alone, not into .git/config.
      - name: Push the bump commit and tag
        env:
          TAG: ${{ needs.bump.outputs.tag }}
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"

  # The publish jobs serve both a fresh release and a tag named by hand,
  # so the retry path runs on every release, not only after a failure.
  # Each publish script skips what already exists.
  crates-io:
    name: crates-io
    needs: [bump, push]
    # `bump` and `push` are skipped on a dispatch, and `always()` keeps
    # that skip from skipping this job too.
    # A dispatch must run from main, so main's copy of this workflow and
    # its tag check apply.
    if: >-
      ${{ always()
          && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
              || needs.push.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      # Through the environment, not inlined into the shell: a dispatch
      # input is free text.
      TAG: ${{ inputs.tag || needs.bump.outputs.tag }}
    steps:
      # The scripts and tools come from main, the tag's files from a
      # worktree. A retry after a fix to a publish script on main then
      # runs the fixed script, not the tag's copy.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A dispatch can name any tag. Publish only tags on main, so a
      # release holds only commits that went through main's checks.
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$TAG" origin/main

      - name: Check out the tag
        run: |
          git worktree add --detach "$RUNNER_TEMP/tag" "$TAG"
          echo "TAG_DIR=$RUNNER_TEMP/tag" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@v31

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_KEY }}
        run: nix-shell --run "cd \"\$TAG_DIR\" && \"\$GITHUB_WORKSPACE/scripts/publish-crate.sh\" \"\$TAG\""

  github-release:
    name: github-release
    needs: [bump, crates-io]
    if: ${{ always() && needs.crates-io.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the tag
        run: |
          git worktree add --detach "$RUNNER_TEMP/tag" "$TAG"
          echo "TAG_DIR=$RUNNER_TEMP/tag" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@v31

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix-shell --run "cd \"\$TAG_DIR\" && \"\$GITHUB_WORKSPACE/scripts/publish-release.sh\" \"\$TAG\""
