# Dependabot keeps every dependency surface (cargo, GitHub Actions,
# pre-commit hooks) at supported versions without manual cargo update /
# pre-commit autoupdate chores. Weekly schedule trades freshness for
# review-fatigue floor.
#
# Commit types `chore(deps)` and `ci(deps)` bump no version in cog.toml,
# so Dependabot updates do not trigger releases.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-deps:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      pre-commit-deps:
        patterns: ["*"]
